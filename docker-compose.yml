name: p2-llm-gateway

x-mock-provider: &mock-provider
  build: .
  command: ["uvicorn", "mock_provider.main:app", "--host", "0.0.0.0", "--port", "8000"]

services:
  gw-api:
    build: .
    ports: ["127.0.0.1:8102:8000"]
    environment:
      DATABASE_URL: postgresql://gateway:gateway@gw-postgres:5432/gateway
      REDIS_URL: redis://gw-redis:6379/0
      GATEWAY_CONFIG: /app/config/gateway.yaml
      GATEWAY_MASTER_KEY: ${GATEWAY_MASTER_KEY:-sk-master-demo}
      PROVIDER_A_URL: http://gw-provider-a:8000/v1
      PROVIDER_A_KEY: mock-key-a
      PROVIDER_B_URL: http://gw-provider-b:8000/v1
      PROVIDER_B_KEY: mock-key-b
      # Optional real upstream for the `smart` group (off unless both are set).
      REAL_UPSTREAM_BASE_URL: ${REAL_UPSTREAM_BASE_URL:-}
      REAL_UPSTREAM_API_KEY: ${REAL_UPSTREAM_API_KEY:-}
      REAL_UPSTREAM_MODEL: ${REAL_UPSTREAM_MODEL:-gpt-4o-mini}
      # Used by the test suite (docker compose run --rm gw-api pytest -q).
      GW_URL: http://gw-api:8000
      PROVIDER_A_ADMIN: http://gw-provider-a:8000
      PROVIDER_B_ADMIN: http://gw-provider-b:8000
    depends_on:
      gw-redis: {condition: service_healthy}
      gw-postgres: {condition: service_healthy}
      gw-provider-a: {condition: service_started}
      gw-provider-b: {condition: service_started}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 3s
      retries: 12

  gw-redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  gw-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: gateway
    volumes: ["gw-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gateway -d gateway"]
      interval: 3s
      retries: 20

  gw-provider-a:
    <<: *mock-provider
    environment: {PROVIDER_NAME: provider-a}
    ports: ["127.0.0.1:8112:8000"]

  gw-provider-b:
    <<: *mock-provider
    environment: {PROVIDER_NAME: provider-b}
    ports: ["127.0.0.1:8113:8000"]

volumes:
  gw-pgdata:
