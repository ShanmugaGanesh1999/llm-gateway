# REFERENCE ONLY: not run by this repo. Equivalent real LiteLLM Proxy config.
# Run with: litellm --config config/litellm_config.reference.yaml --port 4000
# Needs real provider keys plus DATABASE_URL (LiteLLM runs Prisma migrations on start).
model_list:
  - model_name: smart
    litellm_params:
      model: openai/gpt-4o-mini              # illustrative: verify availability
      api_key: os.environ/OPENAI_API_KEY
      timeout: 30
    model_info:
      id: openai-gpt-4o-mini
  - model_name: backup
    litellm_params:
      model: anthropic/claude-3-5-haiku-latest  # illustrative
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 30
    model_info:
      id: anthropic-haiku

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  allowed_fails: 1
  cooldown_time: 15
  fallbacks:
    - smart: [backup]
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: os.environ/REDIS_PORT
    ttl: 300

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
